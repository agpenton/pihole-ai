[project]
name = "pihole-llm-gateway"
version = "0.1.0"
description = "LLM Gateway — OpenRouter client with quota, cache, circuit breaker, and response validation"
requires-python = ">=3.12"
dependencies = [
    "pihole-common",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pihole_llm_gateway"]

[project.scripts]
pihole-llm-gateway = "pihole_llm_gateway.__main__:main"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
