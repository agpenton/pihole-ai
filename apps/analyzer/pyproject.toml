[project]
name = "pihole-analyzer"
version = "0.1.0"
description = "Security analyzer for pihole-ai"
requires-python = ">=3.12"
dependencies = [
    "pihole-common",
    "pihole-llm-gateway",
    "click>=8.1.0",
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
]

[project.scripts]
pihole-analyzer = "pihole_analyzer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pihole_analyzer"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["pihole_analyzer"]
follow_imports = "silent"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
extraPaths = ["src"]
