[project]
name = "pihole-common"
version = "0.1.0"
description = "Shared types, configuration, database models, and utilities for pihole-ai"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "psycopg[binary,pool]>=3.2.4",
    "aiosqlite>=0.20.0",
    "prometheus-client>=0.21.1",
    "structlog>=25.1.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pihole_common"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
